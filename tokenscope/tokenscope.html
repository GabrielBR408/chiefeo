<!DOCTYPE html>
<!--
  TokenScope — Claude API usage intelligence dashboard
  Single-file build. Open from disk, host on any static URL, or share via Dropbox.
  Reads JSONL written by tokenscope/wrappers/tokenscope.{js,py}.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TokenScope</title>
  <meta name="theme-color" content="#07090f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
    integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
    integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"
    integrity="sha384-ku9eM40vVDsFUiERorrdlHlF0LIhdfn716M7TntM72Uo98T7LWiogD3hNenPx8Q0"
    crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #root { height: 100%; }
    body {
      background: #07090f;
      color: #e8eaf0;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1a2035; border-radius: 2px; }
    button { cursor: pointer; font-family: inherit; }
    input, select { font-family: inherit; }
    code { font-family: 'IBM Plex Mono', monospace; font-size: 0.92em; }
    @keyframes tk-spin { to { transform: rotate(360deg); } }
    @keyframes tk-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* Splash screen until React mounts */
    #tk-splash {
      position: fixed; inset: 0; z-index: 2147483646;
      background: #07090f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; transition: opacity 280ms ease;
    }
    #tk-splash.hide { opacity: 0; pointer-events: none; }
    #tk-splash .badge {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(245,166,35,0.12);
      border: 1px solid rgba(245,166,35,0.28);
      display: flex; align-items: center; justify-content: center;
      color: #f5a623; font-size: 24px;
    }
    #tk-splash .title { font-weight: 700; letter-spacing: -0.2px; }
    #tk-splash .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #1a2035; border-top-color: #f5a623;
      animation: tk-spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div id="tk-splash">
    <div class="badge">◈</div>
    <div class="title">TokenScope</div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    /* eslint-disable no-undef */
    const { useState, useEffect, useMemo, useCallback, useRef } = React;
    const {
      AreaChart, Area, BarChart, Bar, LineChart, Line,
      Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
    } = Recharts;

    // ─── Theme ────────────────────────────────────────────────────────────────
    const C = {
      bg: "#07090f", card: "#0e1119", cardAlt: "#0a0d16", border: "#1a2035",
      accent: "#f5a623", accentB: "#3ecfcf", accentC: "#c084fc", accentD: "#f87171",
      text: "#e8eaf0", muted: "#4b5675", mutedLight: "#7a88a8",
      green: "#34d399", red: "#f87171",
    };
    const SEED_TAG_COLORS = {
      "cam-rec": C.accent, "code-projects": C.accentB, "gl-variance": C.accentC,
      "owner-report": "#fb923c", "cheat-sheet": C.green, "expense-report": "#a3e635",
      "chat": "#f472b6", "smoke-test": C.muted,
    };
    const PALETTE = [C.accent, C.accentB, C.accentC, "#fb923c", C.green,
      "#f472b6", "#a3e635", "#60a5fa", "#facc15", "#f87171"];
    const tagColor = (name) => {
      if (SEED_TAG_COLORS[name]) return SEED_TAG_COLORS[name];
      if (!name) return C.muted;
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
      return PALETTE[Math.abs(h) % PALETTE.length];
    };
    const WEIGHTS = [1.00, 0.85, 0.72, 0.61, 0.52, 0.40, 0.30];
    const TAB_DEFS = [
      { key: "overview", label: "Overview", icon: "◈" },
      { key: "by-tag",   label: "By Tag",   icon: "⊞" },
      { key: "models",   label: "Models",   icon: "◉" },
      { key: "log",      label: "Log",      icon: "≡" },
    ];
    const MOBILE_BREAKPOINT = 700;
    const LS_URL_KEY = "tokenscope.dropbox_url";
    const LS_AUTOREFRESH_KEY = "tokenscope.autorefresh";
    const REFRESH_MS = 30_000;

    // ─── Calculations ─────────────────────────────────────────────────────────
    const localDayKey = (date) => {
      const d = date instanceof Date ? date : new Date(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const shortDayLabel = (key) => {
      const [, m, d] = key.split("-");
      return `${MONTHS[+m - 1]} ${+d}`;
    };
    const dayKeysAsc = (days, anchorEnd = new Date()) => {
      const out = [];
      const end = new Date(anchorEnd);
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(end);
        d.setDate(d.getDate() - i);
        out.push(localDayKey(d));
      }
      return out;
    };
    const windowRanges = (days) => {
      const end = new Date(); end.setHours(23, 59, 59, 999);
      const nowStart = new Date(end);
      nowStart.setDate(nowStart.getDate() - (days - 1));
      nowStart.setHours(0, 0, 0, 0);
      const thenEnd = new Date(nowStart);
      thenEnd.setMilliseconds(thenEnd.getMilliseconds() - 1);
      const thenStart = new Date(thenEnd);
      thenStart.setDate(thenStart.getDate() - (days - 1));
      thenStart.setHours(0, 0, 0, 0);
      return {
        now:  { start: nowStart, end },
        then: { start: thenStart, end: thenEnd },
      };
    };
    const applyRecencyWeights = (daysAsc, key) => {
      if (!daysAsc.length) return 0;
      const minW = WEIGHTS[WEIGHTS.length - 1];
      let weighted = 0, total = 0;
      for (let i = 0; i < daysAsc.length; i++) {
        const ageFromToday = daysAsc.length - 1 - i;
        const w = WEIGHTS[ageFromToday] ?? minW;
        weighted += (daysAsc[i][key] ?? 0) * w;
        total += w;
      }
      return total === 0 ? 0 : (weighted / total) * daysAsc.length;
    };
    const calcDelta = (now, then) =>
      (then === 0 || then == null) ? null : ((now - then) / then) * 100;
    const pctFmt = (v) => `${Math.abs(v).toFixed(0)}%`;
    const fmtTokens = (n) => {
      if (n == null) return "—";
      if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
      if (n >= 1_000)     return `${(n / 1_000).toFixed(0)}K`;
      return String(Math.round(n));
    };
    const fmtCost = (n) => n == null ? "—" : `$${Number(n).toFixed(2)}`;
    const fmtMs = (n) => {
      if (n == null) return "—";
      if (n >= 10_000) return `${(n / 1000).toFixed(1)}s`;
      if (n >= 1000)   return `${(n / 1000).toFixed(2)}s`;
      return `${Math.round(n)}ms`;
    };
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString([],
      { hour: "numeric", minute: "2-digit" });

    // ─── Dropbox URL handling + JSONL parsing ─────────────────────────────────
    // Dropbox shared links come in a few shapes; we normalize to a CORS-friendly
    // raw URL the browser can fetch directly. Handles both /scl/fi/... and the
    // older /s/... formats, www.dropbox.com and dl.dropboxusercontent.com.
    const normalizeDropboxUrl = (raw) => {
      if (!raw) return "";
      let u = raw.trim();
      try {
        const parsed = new URL(u);
        if (parsed.hostname.includes("dropbox.com") ||
            parsed.hostname.includes("dropboxusercontent.com")) {
          parsed.searchParams.delete("dl");
          parsed.searchParams.set("raw", "1");
          return parsed.toString();
        }
        return u;
      } catch {
        return u; // not a URL — let fetch error out with a useful message
      }
    };
    const parseJsonl = (text) => {
      const out = [];
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        try { out.push(JSON.parse(line)); }
        catch (e) {
          console.warn(`[TokenScope] skipping bad JSONL line ${i + 1}:`, e.message);
        }
      }
      return out;
    };

    // ─── Hooks ────────────────────────────────────────────────────────────────
    const useIsMobile = () => {
      const detect = () => typeof window !== "undefined" && window.innerWidth < MOBILE_BREAKPOINT;
      const [mob, setMob] = useState(detect);
      useEffect(() => {
        const onResize = () => setMob(detect());
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return mob;
    };

    // Fetch + cache the entire JSONL once per URL change, then re-aggregate
    // locally on every (window, mode) flip — no extra network hits.
    const useRawLogs = (url, autoRefresh) => {
      const [state, setState] = useState({
        loading: !!url, error: null, rows: null, fetchedAt: null,
      });
      const reqId = useRef(0);

      const reload = useCallback(async () => {
        if (!url) {
          setState({ loading: false, error: null, rows: null, fetchedAt: null });
          return;
        }
        const myReq = ++reqId.current;
        setState((s) => ({ ...s, loading: true, error: null }));
        try {
          const target = normalizeDropboxUrl(url);
          // cache: "no-store" so Dropbox's edge cache doesn't pin a stale copy
          // for the polling case. The .jsonl is small enough (single-user) that
          // re-downloading every 30s is cheap.
          const res = await fetch(target, { cache: "no-store" });
          if (!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
          const text = await res.text();
          const rows = parseJsonl(text);
          if (myReq !== reqId.current) return;
          setState({ loading: false, error: null, rows, fetchedAt: new Date() });
        } catch (e) {
          if (myReq !== reqId.current) return;
          setState({
            loading: false,
            error: e?.message || String(e),
            rows: null,
            fetchedAt: null,
          });
        }
      }, [url]);

      useEffect(() => { reload(); }, [reload]);

      useEffect(() => {
        if (!url || !autoRefresh) return;
        const id = setInterval(reload, REFRESH_MS);
        return () => clearInterval(id);
      }, [url, autoRefresh, reload]);

      return { ...state, reload };
    };

    // ─── Aggregation ──────────────────────────────────────────────────────────
    const emptyDayBucket = (key) => ({
      date: key, label: shortDayLabel(key),
      tokens: 0, cost: 0, calls: 0,
      inTok: 0, outTok: 0, cacheR: 0, cacheW: 0, durSum: 0,
    });

    const aggregateLogs = (logs, days, anchorEnd) => {
      const dayKeys = dayKeysAsc(days, anchorEnd);
      const byDay = Object.fromEntries(dayKeys.map((k) => [k, emptyDayBucket(k)]));
      const byTagDay = {};
      const tags = new Map();
      const models = new Map();
      let totalTokens = 0, totalCost = 0, totalCalls = 0;
      let totalIn = 0, totalOut = 0, totalCacheR = 0, totalCacheW = 0, totalDur = 0;

      for (const r of logs) {
        const k = localDayKey(r.created_at);
        const tokens = (r.input_tokens || 0) + (r.output_tokens || 0)
                     + (r.cache_read_tokens || 0) + (r.cache_write_tokens || 0);
        const cost = Number(r.cost_usd || 0);
        const dur  = Number(r.duration_ms || 0);

        if (byDay[k]) {
          const d = byDay[k];
          d.tokens += tokens; d.cost += cost; d.calls += 1;
          d.inTok += r.input_tokens || 0; d.outTok += r.output_tokens || 0;
          d.cacheR += r.cache_read_tokens || 0; d.cacheW += r.cache_write_tokens || 0;
          d.durSum += dur;
        }

        const tb = tags.get(r.tag) || { tokens: 0, calls: 0, inTok: 0, outTok: 0, cacheR: 0, cacheW: 0, cost: 0, durSum: 0 };
        tb.tokens += tokens; tb.calls += 1;
        tb.inTok += r.input_tokens || 0; tb.outTok += r.output_tokens || 0;
        tb.cacheR += r.cache_read_tokens || 0; tb.cacheW += r.cache_write_tokens || 0;
        tb.cost += cost; tb.durSum += dur;
        tags.set(r.tag, tb);

        if (!byTagDay[r.tag]) byTagDay[r.tag] = Object.fromEntries(dayKeys.map((dk) => [dk, 0]));
        if (byTagDay[r.tag][k] != null) byTagDay[r.tag][k] += tokens;

        const mb = models.get(r.model) || { tokens: 0, calls: 0, cost: 0 };
        mb.tokens += tokens; mb.calls += 1; mb.cost += cost;
        models.set(r.model, mb);

        totalTokens += tokens; totalCost += cost; totalCalls += 1;
        totalIn += r.input_tokens || 0; totalOut += r.output_tokens || 0;
        totalCacheR += r.cache_read_tokens || 0; totalCacheW += r.cache_write_tokens || 0;
        totalDur += dur;
      }
      return {
        dayKeys, byDay, byTagDay, tags, models,
        totals: {
          tokens: totalTokens, cost: totalCost, calls: totalCalls,
          inTok: totalIn, outTok: totalOut,
          cacheR: totalCacheR, cacheW: totalCacheW, durSum: totalDur,
        },
      };
    };

    const buildPeriod = (logs, days, weighted, anchorEnd) => {
      const agg = aggregateLogs(logs, days, anchorEnd);
      const dailyAsc = agg.dayKeys.map((k) => agg.byDay[k]);

      const totalTokens = weighted
        ? Math.round(applyRecencyWeights(dailyAsc, "tokens"))
        : agg.totals.tokens;
      const totalCost = weighted
        ? +applyRecencyWeights(dailyAsc, "cost").toFixed(2)
        : +agg.totals.cost.toFixed(2);
      const callCount = weighted
        ? Math.round(applyRecencyWeights(dailyAsc, "calls"))
        : agg.totals.calls;
      const avgLatency = agg.totals.calls ? agg.totals.durSum / agg.totals.calls : 0;
      const cachedReads = agg.totals.cacheR;
      const cacheable   = agg.totals.inTok + agg.totals.cacheR + agg.totals.cacheW;
      const cacheHitRate = cacheable ? (cachedReads / cacheable) * 100 : 0;
      const outputRatio  = agg.totals.inTok ? agg.totals.outTok / agg.totals.inTok : 0;

      const byTag = [...agg.tags.entries()]
        .map(([tag, b]) => ({
          tag, tokens: b.tokens, calls: b.calls, cost: b.cost,
          avgPerCall: b.calls ? b.tokens / b.calls : 0,
        }))
        .sort((a, b) => b.tokens - a.tokens);

      const byTagDailyAsc = Object.fromEntries(
        Object.entries(agg.byTagDay).map(([tag, daily]) => [
          tag, agg.dayKeys.map((k) => daily[k] || 0),
        ])
      );

      const totalModelTokens = agg.totals.tokens || 1;
      const byModel = [...agg.models.entries()]
        .map(([name, b]) => ({
          name, tokens: b.tokens, calls: b.calls,
          cost: +b.cost.toFixed(4),
          pct: +((b.tokens / totalModelTokens) * 100).toFixed(1),
        }))
        .sort((a, b) => b.tokens - a.tokens);

      return {
        totalTokens, totalCost, callCount,
        avgLatency, cacheHitRate, outputRatio,
        byTag, byTagDailyAsc, byModel,
        dayKeys: agg.dayKeys,
        daily: dailyAsc.map((d) => ({
          date: d.date, label: d.label,
          tokens: d.tokens, cost: +d.cost.toFixed(4), calls: d.calls,
        })),
      };
    };

    const useUsageData = (rows, windowSel, mode) => useMemo(() => {
      if (!rows) return null;
      const days = parseInt(windowSel, 10) || 7;
      const { now, then } = windowRanges(days);
      const inRange = (r, start, end) => {
        const t = new Date(r.created_at).getTime();
        return t >= start.getTime() && t <= end.getTime();
      };
      const nowLogs  = rows.filter((r) => inRange(r, now.start,  now.end));
      const thenLogs = rows.filter((r) => inRange(r, then.start, then.end));
      const weighted = mode === "weighted";

      const nowPeriod  = buildPeriod(nowLogs,  days, weighted, now.end);
      const thenPeriod = buildPeriod(thenLogs, days, false,    then.end);

      const recent = nowLogs
        .slice()
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 200)
        .map((r) => ({
          id: r.id, time: r.created_at, tag: r.tag, model: r.model,
          in: r.input_tokens, out: r.output_tokens,
          cacheR: r.cache_read_tokens, cacheW: r.cache_write_tokens,
          cost: Number(r.cost_usd || 0), ms: r.duration_ms,
          stop: r.stop_reason, metadata: r.metadata,
        }));

      return {
        now: { ...nowPeriod, recentCalls: recent },
        then: thenPeriod,
        windowDays: days,
      };
    }, [rows, windowSel, mode]);

    const Mono = ({ children, style = {} }) => (
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", ...style }}>{children}</span>
    );

    const SectionLabel = ({ children, style = {} }) => (
      <div style={{
        fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase",
        color: C.muted, fontFamily: "'IBM Plex Mono', monospace",
        marginBottom: 8, ...style,
      }}>{children}</div>
    );

    const TagBadge = ({ name, style = {} }) => {
      const c = tagColor(name);
      return (
        <span style={{
          background: `${c}22`, color: c, border: `1px solid ${c}55`,
          borderRadius: 4, padding: "3px 9px", fontSize: 12,
          fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap",
          ...style,
        }}>{name}</span>
      );
    };

    const DeltaBadge = ({ now, then, invert = false, fmt = pctFmt, style = {} }) => {
      const d = calcDelta(now, then);
      if (d == null || !isFinite(d)) return null;
      const up = d >= 0;
      const positive = invert ? !up : up;
      return (
        <span style={{
          fontSize: 12, fontWeight: 600,
          color: positive ? C.green : C.red,
          fontFamily: "'IBM Plex Mono', monospace", ...style,
        }}>{up ? "↑" : "↓"} {fmt(d)}</span>
      );
    };

    const WeightBadge = () => (
      <span style={{
        fontSize: 10, background: `${C.accent}22`, color: C.accent,
        border: `1px solid ${C.accent}44`, borderRadius: 3,
        padding: "1px 6px", fontFamily: "'IBM Plex Mono', monospace",
        letterSpacing: "0.05em",
      }}>⚡ weighted</span>
    );

    const EmergingBadge = ({ style = {} }) => (
      <span style={{
        fontSize: 10, background: `${C.accentB}22`, color: C.accentB,
        border: `1px solid ${C.accentB}55`, borderRadius: 3,
        padding: "1px 6px", fontFamily: "'IBM Plex Mono', monospace",
        letterSpacing: "0.05em", marginLeft: 6, ...style,
      }}>EMERGING ▲</span>
    );

    const ChartTooltip = ({ active, payload, label, valueFormatter }) => {
      if (!active || !payload?.length) return null;
      const fmt = valueFormatter || ((v) =>
        typeof v === "number" && v > 999 ? fmtTokens(v) : String(v));
      return (
        <div style={{
          background: C.cardAlt, border: `1px solid ${C.border}`,
          borderRadius: 8, padding: "10px 14px", fontSize: 13,
          boxShadow: "0 6px 20px rgba(0,0,0,0.45)",
        }}>
          <div style={{
            color: C.muted, fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 11, marginBottom: 6,
          }}>{label}</div>
          {payload.map((p, i) => (
            <div key={i} style={{
              color: p.color || C.accent,
              fontFamily: "'IBM Plex Mono', monospace",
              display: "flex", justifyContent: "space-between", gap: 12,
            }}>
              <span>{p.name}</span>
              <span>{fmt(p.value, p)}</span>
            </div>
          ))}
        </div>
      );
    };

    const StatCard = ({ label, display, compareDisplay, nowVal, thenVal,
                        mode, accent, invert = false, fmt }) => {
      const isCompare = mode === "compare";
      const color = accent || C.accent;
      return (
        <div style={{
          background: C.card, border: `1px solid ${C.border}`,
          borderRadius: 12, padding: "18px 20px",
          position: "relative", overflow: "hidden",
          display: "flex", flexDirection: "column", gap: 6, minHeight: 110,
        }}>
          <div style={{
            position: "absolute", top: 0, left: 0, right: 0, height: 2, background: color,
          }} />
          <SectionLabel>{label}</SectionLabel>
          <div style={{
            fontSize: 26, fontWeight: 700, color,
            fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1,
          }}>{display}</div>
          {isCompare ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
              <div style={{ fontSize: 12, color: C.mutedLight }}>
                <Mono style={{ color: C.muted }}>prev </Mono>{compareDisplay}
              </div>
              <DeltaBadge now={nowVal} then={thenVal} invert={invert} fmt={fmt} />
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <WeightBadge />
            </div>
          )}
        </div>
      );
    };

    const EmptyState = ({ title = "No data yet", body, accent = C.muted }) => (
      <div style={{
        background: C.card, border: `1px dashed ${C.border}`,
        borderRadius: 12, padding: "40px 24px",
        textAlign: "center", color: C.mutedLight,
      }}>
        <div style={{
          fontSize: 32, color: accent, marginBottom: 8,
          fontFamily: "'IBM Plex Mono', monospace",
        }}>◌</div>
        <div style={{ fontSize: 14, fontWeight: 600, color: C.text, marginBottom: 6 }}>
          {title}
        </div>

    const LoadingPanel = ({ label = "loading" }) => (

        background: C.card, border: `1px solid ${C.border}`,

          {label}…
        </Mono>
      </div>

    const PillGroup = ({ value, onChange, options, activeColor, isMobile }) => (

          return (
            <button key={k} type="button" onClick={() => onChange(k)} style={{
              padding: isMobile ? "5px 10px" : "6px 14px",

              background: active ? `${ac}22` : "transparent",
              color: active ? ac : C.muted,

              fontFamily: "'IBM Plex Mono', monospace",

    const Header = ({ isMobile, windowSel, onWindowChange, mode, onModeChange,
                      onOpenSettings, configured, fetchedAt, onReload, loading }) => (
      <div style={{
        background: C.card, borderBottom: `1px solid ${C.border}`,
        padding: isMobile ? "12px 14px" : "14px 28px",

          <div style={{
            width: 30, height: 30, borderRadius: 8,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 16, background: `${C.accent}22`,
            border: `1px solid ${C.accent}44`, color: C.accent,
          }}>◈</div>
          <div>
            <div style={{ fontSize: isMobile ? 14 : 16, fontWeight: 700 }}>TokenScope</div>

                fontSize: 11, color: C.muted,

        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <PillGroup value={windowSel} onChange={onWindowChange}

          <PillGroup value={mode} onChange={onModeChange}
            options={[["weighted","⚡ Weighted"],["compare","↔ vs Prior"]]}

        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {configured && (
            <button type="button" onClick={onReload} disabled={loading} title="Refresh now"

                background: "transparent", border: `1px solid ${C.border}`,
                color: loading ? C.muted : C.text, opacity: loading ? 0.6 : 1,
                borderRadius: 6, padding: "5px 10px", fontSize: 12,
                fontFamily: "'IBM Plex Mono', monospace",
              }}>{loading ? "…" : "↻"}</button>

          <button type="button" onClick={onOpenSettings} title="Settings"
            style={{
              background: "transparent", border: `1px solid ${C.border}`,
              color: C.text, borderRadius: 6, padding: "5px 10px",
              fontSize: 12, fontFamily: "'IBM Plex Mono', monospace",
            }}>⚙</button>
          {!isMobile && fetchedAt && (
            <Mono style={{ fontSize: 11, color: C.muted }}>
              ↻ {fetchedAt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}
            </Mono>
          )}
        </div>
      </div>
    );

    const TabBar = ({ tab, onTabChange, variant }) => {
      if (variant === "bottom") {
        return (
          <div style={{
            position: "fixed", bottom: 0, left: 0, right: 0,
            background: C.card, borderTop: `1px solid ${C.border}`,
            display: "flex", zIndex: 100,
            paddingBottom: "env(safe-area-inset-bottom)",
          }}>
            {TAB_DEFS.map((t) => {
              const active = tab === t.key;
              return (
                <button key={t.key} type="button" onClick={() => onTabChange(t.key)}
                  style={{
                    flex: 1, padding: "12px 0",
                    display: "flex", flexDirection: "column",
                    alignItems: "center", gap: 3,
                    background: "transparent", border: "none",
                    color: active ? C.accent : C.muted,
                    borderTop: active ? `2px solid ${C.accent}` : "2px solid transparent",
                  }}>
                  <span style={{ fontSize: 18 }}>{t.icon}</span>
                  <span style={{
                    fontSize: 9, textTransform: "uppercase",
                    letterSpacing: "0.08em",
                    fontFamily: "'IBM Plex Mono', monospace",
                  }}>{t.label.toLowerCase()}</span>
                </button>
              );
            })}
          </div>
        );
      }
      return (
        <div style={{
          background: C.card, borderBottom: `1px solid ${C.border}`,
          padding: "0 28px", display: "flex", gap: 4,
        }}>
          {TAB_DEFS.map((t) => {
            const active = tab === t.key;
            return (
              <button key={t.key} type="button" onClick={() => onTabChange(t.key)}
                style={{
                  padding: "12px 20px", fontSize: 13,
                  fontFamily: "'IBM Plex Mono', monospace",
                  textTransform: "uppercase", letterSpacing: "0.08em",
                  background: "transparent", border: "none",
                  color: active ? C.accent : C.muted,
                  borderBottom: active ? `2px solid ${C.accent}` : "2px solid transparent",
                  transition: "all 0.15s",
                }}>{t.icon} {t.label.toLowerCase()}</button>
            );
          })}
        </div>
      );
    };

    const ModeBar = ({ mode, windowSel, isMobile }) => {
      const isCompare = mode === "compare";
      const color = isCompare ? C.accentB : C.accent;
      const text = isCompare
        ? `Comparing NOW (${windowSel}) vs prior ${windowSel} — deltas show workflow shifts. Tags with no prior history are flagged EMERGING.`
        : "Recency-weighted: recent days count up to ~3.3× more than 7 days ago — summary numbers reflect current trajectory, not flat averages.";
      return (
        <div style={{
          background: isCompare ? `${C.accentB}12` : `${C.accent}0e`,
          borderBottom: `1px solid ${color}33`,
          padding: isMobile ? "8px 14px" : "8px 28px",
          fontSize: 12, color,
          fontFamily: "'IBM Plex Mono', monospace",
          display: "flex", alignItems: "center", gap: 8,
        }}>
          <span>{isCompare ? "↔" : "⚡"}</span>
          <span>{text}</span>
        </div>
      );
    };

    const SettingsPanel = ({ url, onUrlChange, autoRefresh, onAutoRefreshChange,
                             onClose, fetchedAt, error }) => {
      const [draft, setDraft] = useState(url || "");
      useEffect(() => { setDraft(url || ""); }, [url]);
      const save = () => { onUrlChange(draft.trim()); onClose(); };
      const clear = () => { setDraft(""); onUrlChange(""); };
      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 200, padding: 16,
        }} onClick={onClose}>
          <div onClick={(e) => e.stopPropagation()} style={{
            width: "100%", maxWidth: 520,
            background: C.card, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: 24,
            display: "flex", flexDirection: "column", gap: 16,
            animation: "tk-fade-in 0.2s ease",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <div>
                <div style={{ fontSize: 16, fontWeight: 700, color: C.text }}>Data source</div>
                <Mono style={{ fontSize: 11, color: C.muted }}>
                  paste your Dropbox shared link to usage.jsonl
                </Mono>
              </div>
              <button type="button" onClick={onClose} style={{
                background: "transparent", border: "none", color: C.muted,
                fontSize: 20, lineHeight: 1, cursor: "pointer",
              }}>×</button>
            </div>

            <label style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <Mono style={{
                fontSize: 10, color: C.muted, letterSpacing: "0.15em",
                textTransform: "uppercase",
              }}>dropbox link</Mono>
              <input type="url" value={draft} onChange={(e) => setDraft(e.target.value)}
                placeholder="https://www.dropbox.com/scl/fi/.../usage.jsonl?rlkey=…&dl=0"
                style={{
                  width: "100%", background: C.cardAlt,
                  border: `1px solid ${C.border}`, borderRadius: 6,
                  padding: "10px 12px", color: C.text,
                  fontFamily: "'IBM Plex Mono', monospace", fontSize: 12,
                  outline: "none",
                }} />
              <Mono style={{ fontSize: 10, color: C.mutedLight, lineHeight: 1.5 }}>
                paste any Dropbox share format (dl=0 / dl=1 / raw). The dashboard
                normalizes it to a CORS-friendly raw URL automatically.
              </Mono>
            </label>

            <label style={{
              display: "flex", alignItems: "center", gap: 10,
              padding: "8px 0", cursor: "pointer",
            }}>
              <input type="checkbox" checked={autoRefresh}
                onChange={(e) => onAutoRefreshChange(e.target.checked)}
                style={{ accentColor: C.accent, width: 16, height: 16 }} />
              <Mono style={{ fontSize: 12, color: C.text }}>
                auto-refresh every {Math.round(REFRESH_MS / 1000)}s
              </Mono>
            </label>

            {error && (
              <div style={{
                fontSize: 12, color: C.red, padding: "8px 10px",
                background: `${C.red}11`, border: `1px solid ${C.red}33`,
                borderRadius: 6, fontFamily: "'IBM Plex Mono', monospace",
              }}>{error}</div>
            )}
            {fetchedAt && !error && (
              <Mono style={{ fontSize: 11, color: C.muted }}>
                last fetch: {fetchedAt.toLocaleString()}
              </Mono>
            )}

            <div style={{ display: "flex", gap: 8, justifyContent: "space-between" }}>
              <button type="button" onClick={clear} style={{
                background: "transparent", border: `1px solid ${C.border}`,
                color: C.muted, borderRadius: 8, padding: "8px 14px",
                fontFamily: "'IBM Plex Mono', monospace", fontSize: 12,
              }}>clear</button>
              <button type="button" onClick={save} style={{
                background: C.accent, border: "none", color: C.bg,
                borderRadius: 8, padding: "8px 18px", fontWeight: 600,
                fontFamily: "'IBM Plex Mono', monospace", fontSize: 13,
              }}>save</button>
            </div>
          </div>
        </div>
      );
    };

    const SetupHelp = ({ onOpenSettings }) => (
      <div style={{
        background: C.card, border: `1px dashed ${C.border}`,
        borderRadius: 12, padding: "32px 24px",
        animation: "tk-fade-in 0.3s ease",
      }}>
        <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 8 }}>
          Welcome to TokenScope
        </div>
        <Mono style={{ fontSize: 12, color: C.muted, lineHeight: 1.7 }}>
          You haven't connected a data source yet. Three quick steps:
        </Mono>
        <ol style={{
          margin: "16px 0 16px 20px", color: C.text,
          fontSize: 13, lineHeight: 1.8,
        }}>
          <li>Drop the wrapper into your Claude code:&nbsp;
            <code style={{ color: C.accent }}>tokenscope/wrappers/tokenscope.js</code> (or .py)</li>
          <li>Set <code style={{ color: C.accent }}>TOKENSCOPE_LOG_FILE=~/Dropbox/tokenscope/usage.jsonl</code> in your env</li>
          <li>In Dropbox, right-click the file → Share → copy link → paste it below</li>
        </ol>
        <button type="button" onClick={onOpenSettings} style={{
          background: C.accent, border: "none", color: C.bg,
          borderRadius: 8, padding: "10px 18px", fontWeight: 600,
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 13,
        }}>⚙ paste your dropbox link</button>
      </div>
    );

    const pickEmergingTag = (now, then) => {
      if (!now?.byTag?.length) return null;
      const thenMap = new Map((then?.byTag ?? []).map((t) => [t.tag, t.tokens]));
      let best = null;
      for (const t of now.byTag) {
        const prev = thenMap.get(t.tag) || 0;
        const gain = t.tokens - prev;
        if (gain <= 0) continue;
        if (!best || gain > best.gain) best = { tag: t.tag, gain, isNew: prev === 0 };
      }
      return best;
    };

    const Overview = ({ data, mode, windowSel, isMobile }) => {
      const { now, then } = data;
      const compare = mode === "compare";
      const cols = isMobile ? "1fr 1fr" : "repeat(3, 1fr)";

      const stats = [
        { label: "Total Tokens", now: now.totalTokens, then: then?.totalTokens ?? 0,
          display: fmtTokens(now.totalTokens),
          compareDisplay: fmtTokens(then?.totalTokens ?? 0), accent: C.accent },
        { label: "Total Cost", now: now.totalCost, then: then?.totalCost ?? 0,
          display: fmtCost(now.totalCost),
          compareDisplay: fmtCost(then?.totalCost ?? 0), accent: C.accentB },
        { label: "API Calls", now: now.callCount, then: then?.callCount ?? 0,
          display: String(now.callCount),
          compareDisplay: String(then?.callCount ?? 0), accent: C.accentC },
        { label: "Avg Latency", now: now.avgLatency, then: then?.avgLatency ?? 0,
          display: fmtMs(now.avgLatency),
          compareDisplay: fmtMs(then?.avgLatency ?? 0), accent: "#fb923c", invert: true },
        { label: "Cache Hit Rate", now: now.cacheHitRate, then: then?.cacheHitRate ?? 0,
          display: `${now.cacheHitRate.toFixed(0)}%`,
          compareDisplay: `${(then?.cacheHitRate ?? 0).toFixed(0)}%`, accent: C.green },
        { label: "Output Ratio", now: now.outputRatio, then: then?.outputRatio ?? 0,
          display: now.outputRatio.toFixed(2),
          compareDisplay: (then?.outputRatio ?? 0).toFixed(2), accent: "#f472b6" },
      ];

      const emergent = compare ? pickEmergingTag(now, then) : null;
      const emergentDailyAsc = emergent ? now.byTagDailyAsc[emergent.tag] : null;

      const chartData = compare && then?.daily
        ? [
            ...then.daily.map((d) => ({ ...d, emergent: 0 })),
            ...now.daily.map((d, i) => ({
              ...d, emergent: emergentDailyAsc ? emergentDailyAsc[i] : 0,
            })),
          ]
        : now.daily.map((d, i) => ({
            ...d, emergent: emergentDailyAsc ? emergentDailyAsc[i] : 0,
          }));

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <div style={{ display: "grid", gridTemplateColumns: cols, gap: 12 }}>
            {stats.map((s) => (
              <StatCard key={s.label} label={s.label}
                display={s.display} compareDisplay={s.compareDisplay}
                nowVal={s.now} thenVal={s.then}
                accent={s.accent} invert={s.invert} mode={mode} />
            ))}
          </div>

          <div style={{
            background: C.card, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: 20,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
              <SectionLabel>
                Daily Token Volume — {compare ? `${windowSel} now vs prior` : windowSel}
              </SectionLabel>
              {emergent && (
                <Mono style={{ fontSize: 11, color: C.accentB }}>
                  ↑ {emergent.tag} {emergent.isNew ? "emerging" : "growing"}
                </Mono>
              )}
            </div>
            <ResponsiveContainer width="100%" height={isMobile ? 200 : 230}>
              <AreaChart data={chartData}>
                <defs>
                  <linearGradient id="tk-area-tokens" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={C.accent} stopOpacity={0.35} />
                    <stop offset="100%" stopColor={C.accent} stopOpacity={0} />
                  </linearGradient>
                  <linearGradient id="tk-area-emergent" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={C.accentB} stopOpacity={0.25} />
                    <stop offset="100%" stopColor={C.accentB} stopOpacity={0} />
                  </linearGradient>
                </defs>
                <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                <XAxis dataKey="label" stroke={C.muted}
                  tick={{ fontSize: isMobile ? 10 : 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  minTickGap={isMobile ? 16 : 8} />
                <YAxis stroke={C.muted}
                  tick={{ fontSize: isMobile ? 10 : 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  tickFormatter={(v) => fmtTokens(v)} />
                <Tooltip content={<ChartTooltip />} />
                <Area dataKey="tokens" name="tokens" stroke={C.accent}
                  strokeWidth={2} fill="url(#tk-area-tokens)" dot={false} />
                {emergent && (
                  <Area dataKey="emergent" name={emergent.tag} stroke={C.accentB}
                    strokeWidth={2} fill="url(#tk-area-emergent)" dot={false} />
                )}
              </AreaChart>
            </ResponsiveContainer>
            {compare && (
              <Mono style={{
                fontSize: 11, color: C.muted, marginTop: 8, display: "block",
              }}>← prior {windowSel} | current {windowSel} →</Mono>
            )}
          </div>

          <div style={{
            background: C.card, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: 20,
          }}>
            <SectionLabel>Daily Cost ($) — burn rate</SectionLabel>
            <ResponsiveContainer width="100%" height={isMobile ? 160 : 180}>
              <LineChart data={now.daily}>
                <CartesianGrid stroke={C.border} strokeDasharray="3 3" />
                <XAxis dataKey="label" stroke={C.muted}
                  tick={{ fontSize: isMobile ? 10 : 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  minTickGap={isMobile ? 16 : 8} />
                <YAxis stroke={C.muted}
                  tick={{ fontSize: isMobile ? 10 : 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  tickFormatter={(v) => fmtCost(v)} />
                <Tooltip content={<ChartTooltip valueFormatter={(v) => fmtCost(v)} />} />
                <Line dataKey="cost" name="cost" stroke={C.accentB}
                  strokeWidth={2} dot={{ fill: C.accentB, r: 3 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    };

    const ByTag = ({ data, mode, isMobile }) => {
      const { now, then } = data;
      const compare = mode === "compare";
      const tagsNow = now.byTag;

      if (!tagsNow.length) {
        return (
          <EmptyState title="No tagged calls yet in this window" body={
            <>Send a call through the wrapper with a <code>tag</code> argument and refresh.</>
          } />
        );
      }

      const thenMap = new Map((then?.byTag ?? []).map((t) => [t.tag, t]));
      const chartRows = tagsNow.map((t) => ({
        tag: t.tag, now: t.tokens,
        then: thenMap.get(t.tag)?.tokens ?? 0,
        color: tagColor(t.tag),
      }));

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{
            background: C.card, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: 20,
          }}>
            <SectionLabel>{compare
              ? "NOW vs PRIOR — Tokens by Tag"
              : "⚡ Recency-Weighted Token Share by Tag"}</SectionLabel>
            <ResponsiveContainer width="100%" height={isMobile ? 240 : 280}>
              <BarChart data={chartRows} layout="vertical">
                <CartesianGrid stroke={C.border} horizontal={false} />
                <XAxis type="number" stroke={C.muted}
                  tick={{ fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }}
                  tickFormatter={(v) => fmtTokens(v)} />
                <YAxis type="category" dataKey="tag" stroke={C.muted}
                  tick={{ fontSize: isMobile ? 10 : 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  width={isMobile ? 90 : 120} />
                <Tooltip content={<ChartTooltip />} />
                <Bar dataKey="now" name={compare ? "now" : "tokens"} radius={[0, 3, 3, 0]}>
                  {chartRows.map((r, i) => (
                    <Cell key={i} fill={compare ? C.accent : r.color} fillOpacity={0.85} />
                  ))}
                </Bar>
                {compare && (
                  <Bar dataKey="then" name="prior" fill={C.muted}
                    fillOpacity={0.4} radius={[0, 3, 3, 0]} />
                )}
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div style={{
            display: "grid",
            gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)", gap: 12,
          }}>
            {tagsNow.map((t) => {
              const prev = thenMap.get(t.tag);
              const isNew = !prev || prev.tokens === 0;
              const color = tagColor(t.tag);
              const cells = [
                ["tokens", fmtTokens(t.tokens), prev ? fmtTokens(prev.tokens) : "—"],
                ["calls", String(t.calls), prev ? String(prev.calls) : "—"],
                ["avg/call", fmtTokens(t.avgPerCall),
                  prev?.calls ? fmtTokens(prev.tokens / prev.calls) : "—"],
              ];
              return (
                <div key={t.tag} style={{
                  background: C.card, border: `1px solid ${C.border}`,
                  borderLeft: `3px solid ${color}`,
                  borderRadius: 10, padding: "16px 20px",
                }}>
                  <div style={{
                    display: "flex", alignItems: "center", gap: 8,
                    marginBottom: 12, flexWrap: "wrap",
                  }}>
                    <Mono style={{ color, fontWeight: 600, fontSize: 14 }}>{t.tag}</Mono>
                    {isNew && compare && <EmergingBadge />}
                  </div>
                  <div style={{
                    display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12,
                  }}>
                    {cells.map(([lbl, nowVal, thenVal]) => (
                      <div key={lbl}>
                        <div style={{
                          fontSize: 10, color: C.muted, textTransform: "uppercase",
                          letterSpacing: "0.1em",
                          fontFamily: "'IBM Plex Mono', monospace",
                          marginBottom: 4,
                        }}>{lbl}</div>
                        <div style={{
                          fontSize: 20, fontWeight: 700, color: C.text,
                          fontFamily: "'IBM Plex Mono', monospace",
                        }}>{nowVal}</div>
                        {compare && (
                          <div style={{
                            fontSize: 11, color: C.muted, marginTop: 2,
                            fontFamily: "'IBM Plex Mono', monospace",
                          }}>prev: {thenVal}</div>
                        )}
                      </div>
                    ))}
                  </div>
                  {compare && !isNew && prev?.tokens > 0 && (
                    <div style={{
                      marginTop: 12, paddingTop: 10,
                      borderTop: `1px solid ${C.border}`,
                    }}>
                      <DeltaBadge now={t.tokens} then={prev.tokens} />
                      <Mono style={{ fontSize: 11, color: C.muted, marginLeft: 8 }}>
                        token volume
                      </Mono>
                    </div>
                  )}
                  {compare && isNew && (
                    <div style={{
                      marginTop: 12, paddingTop: 10,
                      borderTop: `1px solid ${C.border}`,
                      fontSize: 12, color: C.accentB,
                      fontFamily: "'IBM Plex Mono', monospace",
                    }}>▲ New tag this period — no prior history to compare</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const MODEL_PALETTE = [C.accent, C.accentB, C.accentC, "#fb923c", C.green, "#f472b6"];
    const prettyModelName = (name) => {
      if (!name) return "—";
      const m = name.match(/claude-(opus|sonnet|haiku)-?(\d[\d-]*)/i);
      if (!m) return name;
      const tier = m[1].charAt(0).toUpperCase() + m[1].slice(1);
      return `${tier} ${m[2].replaceAll("-", ".")}`;
    };

    const Models = ({ data, mode, isMobile }) => {
      const { now, then } = data;
      const compare = mode === "compare";

      if (!now.byModel.length) {
        return <EmptyState title="No model usage in this window"
          body="The Models tab populates as soon as the wrapper logs its first call." />;
      }

      const thenMap = new Map((then?.byModel ?? []).map((m) => [m.name, m]));
      const cards = now.byModel.map((m, i) => ({
        ...m,
        color: MODEL_PALETTE[i % MODEL_PALETTE.length],
        prevPct:  thenMap.get(m.name)?.pct  ?? 0,
        prevCost: thenMap.get(m.name)?.cost ?? 0,
        isNew: !thenMap.has(m.name),
      }));
      const costData = now.byModel.map((m, i) => ({
        model: prettyModelName(m.name),
        cost: m.cost,
        prev: thenMap.get(m.name)?.cost ?? 0,
        color: MODEL_PALETTE[i % MODEL_PALETTE.length],
      }));

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{
            display: "grid",
            gridTemplateColumns: isMobile ? "1fr" : `repeat(${Math.min(cards.length, 3)}, 1fr)`,
            gap: 14,
          }}>
            {cards.map((m) => (
              <div key={m.name} style={{
                background: C.card,
                border: `1px solid ${m.color}44`,
                borderTop: `3px solid ${m.color}`,
                borderRadius: 12, padding: "20px 24px",
              }}>
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  alignItems: "baseline", gap: 8,
                }}>
                  <Mono style={{ color: m.color, fontWeight: 600, fontSize: 14 }}>
                    {prettyModelName(m.name)}
                  </Mono>
                  {compare && m.isNew && <EmergingBadge />}
                </div>
                <div style={{
                  fontSize: 40, fontWeight: 700, color: C.text,
                  fontFamily: "'IBM Plex Mono', monospace",
                  marginTop: 10, lineHeight: 1,
                }}>{m.pct.toFixed(0)}%</div>
                {compare ? (
                  <div style={{
                    fontSize: 13, color: C.muted, marginTop: 6,
                    display: "flex", gap: 10, alignItems: "center",
                    fontFamily: "'IBM Plex Mono', monospace",
                  }}>
                    <span>prior: {m.prevPct.toFixed(0)}%</span>
                    <DeltaBadge now={m.pct} then={m.prevPct} />
                  </div>
                ) : (
                  <div style={{ marginTop: 6 }}><WeightBadge /></div>
                )}
                <div style={{
                  marginTop: 14, height: 6,
                  background: C.border, borderRadius: 3,
                }}>
                  <div style={{
                    width: `${Math.min(100, m.pct)}%`, height: "100%",
                    background: m.color, borderRadius: 3,
                    transition: "width 0.4s",
                  }} />
                </div>
                {compare && (
                  <>
                    <div style={{
                      marginTop: 4, height: 4,
                      background: C.border, borderRadius: 3,
                    }}>
                      <div style={{
                        width: `${Math.min(100, m.prevPct)}%`, height: "100%",
                        background: m.color, opacity: 0.35, borderRadius: 3,
                      }} />
                    </div>
                    <div style={{
                      fontSize: 10, color: C.muted, marginTop: 4,
                      fontFamily: "'IBM Plex Mono', monospace",
                    }}>darker bar = prior period</div>
                  </>
                )}
                <div style={{
                  marginTop: 12, fontSize: 12, color: C.mutedLight,
                  fontFamily: "'IBM Plex Mono', monospace",
                }}>{m.calls} calls · {fmtCost(m.cost)}</div>
              </div>
            ))}
          </div>

          <div style={{
            background: C.card, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: 20,
          }}>
            <SectionLabel>Cost Attribution by Model</SectionLabel>
            <ResponsiveContainer width="100%" height={isMobile ? 200 : 220}>
              <BarChart data={costData}>
                <CartesianGrid stroke={C.border} />
                <XAxis dataKey="model" stroke={C.muted}
                  tick={{ fontSize: isMobile ? 11 : 13, fontFamily: "'IBM Plex Mono', monospace" }} />
                <YAxis stroke={C.muted}
                  tick={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}
                  tickFormatter={(v) => fmtCost(v)} />
                <Tooltip content={<ChartTooltip valueFormatter={(v) => fmtCost(v)} />} />
                <Bar dataKey="cost" name="cost now" radius={[4, 4, 0, 0]}>
                  {costData.map((c, i) => <Cell key={i} fill={c.color} fillOpacity={0.85} />)}
                </Bar>
                {compare && (
                  <Bar dataKey="prev" name="cost prior" fill={C.muted}
                    fillOpacity={0.35} radius={[4, 4, 0, 0]} />
                )}
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    };

    const FilterSelect = ({ label, value, onChange, options }) => (
      <label style={{
        display: "inline-flex", alignItems: "center", gap: 6,
        background: C.cardAlt, border: `1px solid ${C.border}`,
        borderRadius: 6, padding: "4px 8px",
        fontFamily: "'IBM Plex Mono', monospace",
        fontSize: 11, color: C.muted,
      }}>
        {label}
        <select value={value} onChange={(e) => onChange(e.target.value)} style={{
          background: "transparent", color: C.text, border: "none",
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none",
        }}>
          {options.map((o) => (
            <option key={o} value={o} style={{ background: C.card, color: C.text }}>{o}</option>
          ))}
        </select>
      </label>
    );

    const PageBtn = ({ children, disabled, onClick }) => (
      <button type="button" disabled={disabled} onClick={onClick} style={{
        background: "transparent", border: `1px solid ${C.border}`,
        color: disabled ? C.muted : C.text, opacity: disabled ? 0.5 : 1,
        borderRadius: 6, padding: "5px 12px",
        fontFamily: "'IBM Plex Mono', monospace", fontSize: 11,
      }}>{children}</button>
    );

    const PAGE_SIZE = 50;

    const Log = ({ data, isMobile }) => {
      const all = data.now.recentCalls || [];
      const [tagFilter,   setTagFilter]   = useState("all");
      const [modelFilter, setModelFilter] = useState("all");
      const [page,        setPage]        = useState(0);

      const tags   = useMemo(() => ["all", ...new Set(all.map((r) => r.tag))],   [all]);
      const models = useMemo(() => ["all", ...new Set(all.map((r) => r.model))], [all]);
      const filtered = useMemo(() => all.filter((r) =>
        (tagFilter === "all" || r.tag === tagFilter) &&
        (modelFilter === "all" || r.model === modelFilter)
      ), [all, tagFilter, modelFilter]);
      const pageRows  = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

      if (!all.length) {
        return <EmptyState title="Log is empty for this window"
          body="As the wrapper inserts rows, calls show up here in reverse chronological order." />;
      }

      return (
        <div style={{
          background: C.card, border: `1px solid ${C.border}`,
          borderRadius: 12, overflow: "hidden",
        }}>
          <div style={{
            padding: "16px 20px", borderBottom: `1px solid ${C.border}`,
            display: "flex", flexWrap: "wrap", alignItems: "center",
            justifyContent: "space-between", gap: 10,
          }}>
            <SectionLabel style={{ marginBottom: 0 }}>Recent API Calls</SectionLabel>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              <FilterSelect label="tag" value={tagFilter}
                onChange={(v) => { setTagFilter(v); setPage(0); }} options={tags} />
              <FilterSelect label="model" value={modelFilter}
                onChange={(v) => { setModelFilter(v); setPage(0); }} options={models} />
              <Mono style={{ fontSize: 11, color: C.muted }}>
                {filtered.length} of {all.length}
              </Mono>
            </div>
          </div>

          {isMobile ? (
            <div style={{ display: "flex", flexDirection: "column" }}>
              {pageRows.map((r, i) => (
                <div key={r.id || i} style={{
                  padding: "14px 18px",
                  borderBottom: `1px solid ${C.border}55`,
                  background: i % 2 === 0 ? "transparent" : C.cardAlt,
                }}>
                  <div style={{
                    display: "flex", justifyContent: "space-between",
                    marginBottom: 8, alignItems: "center",
                  }}>
                    <TagBadge name={r.tag} />
                    <Mono style={{ fontSize: 12, color: C.muted }}>{fmtTime(r.time)}</Mono>
                  </div>
                  <div style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(4, 1fr)", gap: 8,
                  }}>
                    {[
                      ["model", r.model.replace(/^claude-/, "")],
                      ["in",    fmtTokens(r.in)],
                      ["out",   fmtTokens(r.out)],
                      ["cost",  fmtCost(r.cost)],
                    ].map(([l, v]) => (
                      <div key={l}>
                        <div style={{
                          fontSize: 9, color: C.muted, textTransform: "uppercase",
                          letterSpacing: "0.1em",
                          fontFamily: "'IBM Plex Mono', monospace",
                        }}>{l}</div>
                        <div title={String(v)} style={{
                          fontSize: 13, fontFamily: "'IBM Plex Mono', monospace",
                          color: C.text, marginTop: 2,
                          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        }}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <Mono style={{
                    fontSize: 11, color: C.mutedLight,
                    marginTop: 6, display: "block",
                  }}>latency {fmtMs(r.ms)}{r.cacheR ? ` · cache ${fmtTokens(r.cacheR)}` : ""}</Mono>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                    {["Time","Tag","Model","Input","Output","Cache R","Cost","Latency"].map((h) => (
                      <th key={h} style={{
                        padding: "10px 16px", textAlign: "left",
                        fontSize: 10, color: C.muted,
                        fontFamily: "'IBM Plex Mono', monospace",
                        textTransform: "uppercase", letterSpacing: "0.1em",
                      }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {pageRows.map((r, i) => (
                    <tr key={r.id || i} style={{
                      borderBottom: `1px solid ${C.border}55`,
                      background: i % 2 === 0 ? "transparent" : C.cardAlt,
                    }}>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13, color: C.muted }}>{fmtTime(r.time)}</Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}><TagBadge name={r.tag} /></td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13 }}>{r.model.replace(/^claude-/, "")}</Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13, color: C.accent }}>{fmtTokens(r.in)}</Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13, color: C.accentB }}>{fmtTokens(r.out)}</Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13, color: C.mutedLight }}>
                          {r.cacheR ? fmtTokens(r.cacheR) : "—"}
                        </Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13, color: "#fbbf24" }}>{fmtCost(r.cost)}</Mono>
                      </td>
                      <td style={{ padding: "12px 16px" }}>
                        <Mono style={{ fontSize: 13 }}>{fmtMs(r.ms)}</Mono>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {pageCount > 1 && (
            <div style={{
              padding: "12px 20px", borderTop: `1px solid ${C.border}`,
              display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              <PageBtn disabled={page === 0} onClick={() => setPage(page - 1)}>← prev</PageBtn>
              <Mono style={{ fontSize: 11, color: C.muted }}>
                page {page + 1} of {pageCount}
              </Mono>
              <PageBtn disabled={page >= pageCount - 1} onClick={() => setPage(page + 1)}>
                next →
              </PageBtn>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const isMobile = useIsMobile();
      const [tab, setTab]     = useState("overview");
      const [mode, setMode]   = useState("weighted");
      const [winSel, setWin]  = useState("7d");
      const [url, setUrl]     = useState(() => localStorage.getItem(LS_URL_KEY) || "");
      const [autoRefresh, setAutoRefresh] = useState(() => {
        const raw = localStorage.getItem(LS_AUTOREFRESH_KEY);
        return raw === null ? true : raw === "1";
      });
      // Open settings automatically on first run if no URL is configured.
      const [settingsOpen, setSettingsOpen] = useState(() => !localStorage.getItem(LS_URL_KEY));

      useEffect(() => {
        if (url) localStorage.setItem(LS_URL_KEY, url);
        else     localStorage.removeItem(LS_URL_KEY);
      }, [url]);
      useEffect(() => {
        localStorage.setItem(LS_AUTOREFRESH_KEY, autoRefresh ? "1" : "0");
      }, [autoRefresh]);

      const { rows, loading, error, fetchedAt, reload } = useRawLogs(url, autoRefresh);
      const data = useUsageData(rows, winSel, mode);

      return (
        <div style={{
          minHeight: "100vh", background: C.bg, color: C.text,
          fontFamily: "'DM Sans', sans-serif",
          paddingBottom: isMobile ? 76 : 0,
        }}>
          <Header isMobile={isMobile}
            windowSel={winSel} onWindowChange={setWin}
            mode={mode} onModeChange={setMode}
            onOpenSettings={() => setSettingsOpen(true)}
            configured={!!url}
            fetchedAt={fetchedAt} onReload={reload} loading={loading} />
          {!isMobile && <TabBar tab={tab} onTabChange={setTab} variant="top" />}
          <ModeBar mode={mode} windowSel={winSel} isMobile={isMobile} />

          <main style={{
            padding: isMobile ? 16 : "28px 28px",
            maxWidth: 1360, margin: "0 auto",
          }}>
            {!url && <SetupHelp onOpenSettings={() => setSettingsOpen(true)} />}
            {url && loading && !data && <LoadingPanel label="loading log" />}
            {url && error && (
              <EmptyState title="Couldn't load the log file" accent={C.red} body={
                <>
                  <div style={{ color: C.red, marginBottom: 8 }}>{error}</div>
                  <div>Check that the Dropbox link is publicly shared and that the file exists.</div>
                </>
              } />
            )}
            {url && !error && data && (
              <PageContent tab={tab} data={data} mode={mode}
                windowSel={winSel} isMobile={isMobile} />
            )}
          </main>

          {isMobile && <TabBar tab={tab} onTabChange={setTab} variant="bottom" />}

          {settingsOpen && (
            <SettingsPanel
              url={url} onUrlChange={setUrl}
              autoRefresh={autoRefresh} onAutoRefreshChange={setAutoRefresh}
              fetchedAt={fetchedAt} error={error}
              onClose={() => setSettingsOpen(false)} />
          )}
        </div>
      );
    };

    const PageContent = ({ tab, data, mode, windowSel, isMobile }) => {
      const hasAny = data.now.callCount > 0 || data.now.recentCalls?.length;
      if (!hasAny && tab !== "log") {
        return (
          <EmptyState title="No usage logged in this window" body={
            <>Send a tagged call through the wrapper:
              <pre style={{
                marginTop: 12, background: C.cardAlt,
                border: `1px solid ${C.border}`, borderRadius: 8,
                padding: "10px 12px",
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 12, color: C.text,
                textAlign: "left", overflowX: "auto",
              }}>{`import { claudeCall } from "./tokenscope.js";

await claudeCall({
  tag: "smoke-test",
  messages: [{ role: "user", content: "ping" }],
});`}</pre>
            </>
          } />
        );
      }
      switch (tab) {
        case "overview": return <Overview data={data} mode={mode} windowSel={windowSel} isMobile={isMobile} />;
        case "by-tag":   return <ByTag    data={data} mode={mode} isMobile={isMobile} />;
        case "models":   return <Models   data={data} mode={mode} isMobile={isMobile} />;
        case "log":      return <Log      data={data} isMobile={isMobile} />;
        default:         return null;
      }
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    // Hide splash once React has mounted.
    requestAnimationFrame(() => {
      const splash = document.getElementById("tk-splash");
      if (splash) {
        splash.classList.add("hide");
        setTimeout(() => splash.remove(), 360);
      }
    });
  </script>
</body>
</html>
