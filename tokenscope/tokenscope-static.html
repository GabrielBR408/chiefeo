<!DOCTYPE html>
<!-- TokenScope mockup — bundled with esbuild. No CDN dependencies for JS. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TokenScope</title>
<meta name="theme-color" content="#07090f" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body, #root { height: 100%; }
  body {
    background: #07090f; color: #e8eaf0;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #1a2035; border-radius: 2px; }
  button { cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; }
  @keyframes tk-spin { to { transform: rotate(360deg); } }
  #tk-splash {
    position: fixed; inset: 0; z-index: 2147483646;
    background: #07090f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; transition: opacity 280ms ease;
  }
  #tk-splash.hide { opacity: 0; pointer-events: none; }
  #tk-splash .badge {
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.28);
    display: flex; align-items: center; justify-content: center;
    color: #f5a623; font-size: 24px;
  }
  #tk-splash .title { font-weight: 700; }
  #tk-splash .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #1a2035; border-top-color: #f5a623;
    animation: tk-spin 0.8s linear infinite;
  }
</style>
</head>
<body>
<div id="tk-splash">
  <div class="badge">◈</div>
  <div class="title">TokenScope</div>
  <div class="spinner"></div>
</div>
<div id="root"></div>

<script>
window.tkShowError = function (label, detail) {
  var el = document.getElementById("tk-splash");
  if (!el) return;
  el.classList.remove("hide");
  el.style.transition = "none";
  el.style.opacity = "1";
  el.innerHTML =
    '<div style="max-width:560px;padding:24px;color:#f87171;font-family:\'IBM Plex Mono\',ui-monospace,monospace;text-align:left;">' +
    '<div style="font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;">' + label + '</div>' +
    '<div style="font-size:13px;color:#e8eaf0;line-height:1.6;white-space:pre-wrap;word-break:break-word;">' + String(detail) + '</div>' +
    '</div>';
};
window.addEventListener("error", function (e) {
  window.tkShowError("script error", (e.message || "(no message)") + "\nat " + (e.filename || "?") + ":" + (e.lineno || 0));
});
window.addEventListener("unhandledrejection", function (e) {
  window.tkShowError("promise rejected", (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
});
setTimeout(function () {
  if (!window.__tkMounted) {
    window.tkShowError("startup timeout", "App didn't mount within 5s. The inlined bundle either didn't execute or threw silently.");
  }
}, 5000);
</script>
