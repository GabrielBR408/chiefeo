<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pic for Sale — Snap it. List it. Sell it.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0f0f1a;
      color: #f4f4f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }
    #root {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, textarea, select {
      font-family: inherit;
      background: #1a1a2e;
      color: #f4f4f7;
      border: 1px solid #2a2a40;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus, select:focus { border-color: #34d399; }
    textarea { resize: vertical; min-height: 110px; line-height: 1.5; }

    .header {
      padding: 24px 20px 8px;
      text-align: center;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-accent { color: #34d399; }
    .tagline {
      font-size: 13px;
      color: #8888a0;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .home-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
      padding: 20px 0 40px;
    }
    .home-headline {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .home-subhead {
      font-size: 15px;
      color: #a0a0b8;
      max-width: 280px;
      margin: 0;
      line-height: 1.5;
    }

    .camera-button {
      background: #34d399;
      color: #0a1f17;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.45), 0 0 0 0 rgba(52, 211, 153, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      animation: pulse 2.4s ease-in-out infinite;
      position: relative;
    }
    .camera-button:active {
      transform: scale(0.96);
    }
    .camera-button .cam-icon { font-size: 56px; line-height: 1; }
    .camera-button input { display: none; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.45), 0 0 0 0 rgba(52, 211, 153, 0.45); }
      50% { box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.6), 0 0 0 18px rgba(52, 211, 153, 0); }
    }

    .how-it-works {
      padding: 8px 20px 28px;
      border-top: 1px solid #1d1d2e;
    }
    .how-title {
      font-size: 11px;
      font-weight: 600;
      color: #6c6c84;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 14px;
    }
    .how-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .how-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .how-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .how-label {
      font-size: 11px;
      color: #a0a0b8;
      font-weight: 500;
    }
    .how-arrow { color: #34d399; font-size: 16px; flex-shrink: 0; }

    .photo-preview {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-thumb {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: #8888a0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .btn {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: transform 0.1s ease, opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #34d399; color: #0a1f17; }
    .btn-secondary { background: #1a1a2e; color: #f4f4f7; border: 1px solid #2a2a40; }
    .btn-ghost { background: transparent; color: #a0a0b8; }

    .row { display: flex; gap: 10px; }
    .row > .btn { flex: 1; }

    .field { margin-bottom: 14px; }

    .audio-card {
      background: #14142a;
      border: 1px solid #1d1d2e;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .audio-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #34d399;
      color: #0a1f17;
      font-size: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .mic-btn.recording {
      background: #ef4444;
      color: #fff;
      animation: recPulse 1.1s ease-in-out infinite;
    }
    @keyframes recPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
      50% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
    }
    .audio-info {
      flex: 1;
      min-width: 0;
    }
    .audio-title { font-size: 14px; font-weight: 600; }
    .audio-sub { font-size: 12px; color: #8888a0; margin-top: 2px; }

    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
      flex: 1;
    }
    .wave-bar {
      flex: 1;
      background: #34d399;
      border-radius: 2px;
      min-height: 4px;
      animation: waveBounce 0.9s ease-in-out infinite;
    }
    @keyframes waveBounce {
      0%, 100% { height: 20%; }
      50% { height: 90%; }
    }

    .audio-saved {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #34d399;
      font-weight: 500;
    }

    .analyzing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 60px 20px;
      text-align: center;
    }
    .spinner {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid #1a1a2e;
      border-top-color: #34d399;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .analyzing-text {
      font-size: 18px;
      font-weight: 600;
    }
    .analyzing-sub {
      font-size: 13px;
      color: #8888a0;
      max-width: 240px;
    }

    .listing-header {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: #14142a;
      border: 1px solid #1d1d2e;
      border-radius: 16px;
    }
    .listing-meta { flex: 1; min-width: 0; }
    .listing-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .listing-title-preview {
      font-size: 14px;
      font-weight: 600;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.3;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #34d399;
      color: #0a1f17;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
      animation: toastIn 0.25s ease;
      z-index: 100;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #4a4a60;
      padding: 12px 20px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    const { useState, useRef, useEffect } = React;

    const SAMPLE_LISTINGS = [
      {
        title: "KitchenAid Artisan Stand Mixer — Like New",
        category: "Home & Kitchen",
        description: "KitchenAid Artisan Series 5-Quart Stand Mixer in Empire Red. Barely used, kept on counter and wiped after each use. Comes with original flat beater, dough hook, and wire whip. Pet-free and smoke-free home. Perfect for home bakers — runs quietly and powerfully. No box.",
        priceRange: "$85 – $120",
      },
      {
        title: "Men's Brown Leather Jacket — Size L, Excellent Condition",
        category: "Clothing & Accessories",
        description: "Genuine leather men's biker-style jacket in rich brown. Size Large. Worn only a handful of times — no scuffs, scratches, or odors. Two zip front pockets and one inner pocket. Smooth full-zip closure. Fits true to size. From a smoke-free home.",
        priceRange: "$45 – $75",
      },
      {
        title: "SecretLab Titan Gaming Chair — Black, Adult-Owned",
        category: "Furniture",
        description: "SecretLab Titan ergonomic gaming chair in stealth black. Adult-owned and used in a home office, not abused by gamers. Memory foam lumbar pillow and headrest pillow included. All recline and tilt functions work perfectly. Minor wear on armrests, otherwise like new. Local pickup preferred — heavy item.",
        priceRange: "$180 – $250",
      },
      {
        title: "Vintage Mid-Century Brass Table Lamp",
        category: "Home Decor",
        description: "Beautiful vintage mid-century modern table lamp with a solid brass base and original cream linen drum shade. Approximately 22 inches tall. Newly rewired and tested — works perfectly. A great accent piece for a living room, bedroom, or office. Patina adds character; no major dings.",
        priceRange: "$35 – $60",
      },
    ];

    const CATEGORIES = [
      "Home & Kitchen",
      "Furniture",
      "Clothing & Accessories",
      "Home Decor",
      "Electronics",
      "Tools",
      "Toys & Games",
      "Sports & Outdoors",
      "Books & Media",
      "Other",
    ];

    function Header() {
      return (
        <div className="header">
          <div className="brand">Pic <span className="brand-accent">for</span> Sale</div>
          <div className="tagline">Snap it. List it. Sell it.</div>
        </div>
      );
    }

    function HowItWorks() {
      return (
        <div className="how-it-works">
          <p className="how-title">How it works</p>
          <div className="how-row">
            <div className="how-step">
              <div className="how-icon">📸</div>
              <div className="how-label">Snap</div>
            </div>
            <div className="how-arrow">→</div>
            <div className="how-step">
              <div className="how-icon">🤖</div>
              <div className="how-label">AI lists it</div>
            </div>
            <div className="how-arrow">→</div>
            <div className="how-step">
              <div className="how-icon">📋</div>
              <div className="how-label">Copy & sell</div>
            </div>
          </div>
        </div>
      );
    }

    function HomeScreen({ onPhoto }) {
      const inputRef = useRef(null);

      const handleChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => onPhoto({ dataUrl: ev.target.result, file });
        reader.readAsDataURL(file);
      };

      return (
        <>
          <div className="screen">
            <div className="home-hero">
              <h1 className="home-headline">Point. Shoot.<br/>Sell.</h1>
              <p className="home-subhead">Take a photo of what you want to sell — AI writes the listing for you.</p>
              <button
                className="camera-button"
                onClick={() => inputRef.current && inputRef.current.click()}
                aria-label="Take photo"
              >
                <span className="cam-icon">📸</span>
                <span>Take Photo</span>
                <input
                  ref={inputRef}
                  type="file"
                  accept="image/*"
                  capture="environment"
                  onChange={handleChange}
                />
              </button>
            </div>
          </div>
          <HowItWorks />
        </>
      );
    }

    function PhotoReviewScreen({ photo, onAddAudio, onSkipAudio, onRetake }) {
      const [recording, setRecording] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);
      const [duration, setDuration] = useState(0);
      const [error, setError] = useState(null);
      const recorderRef = useRef(null);
      const chunksRef = useRef([]);
      const timerRef = useRef(null);
      const startTimeRef = useRef(0);

      useEffect(() => () => {
        if (timerRef.current) clearInterval(timerRef.current);
        if (recorderRef.current && recorderRef.current.state === "recording") {
          recorderRef.current.stop();
        }
      }, []);

      const startRecording = async () => {
        setError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          recorderRef.current = recorder;
          chunksRef.current = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunksRef.current.push(e.data);
          };
          recorder.onstop = () => {
            const blob = new Blob(chunksRef.current, { type: "audio/webm" });
            setAudioUrl(URL.createObjectURL(blob));
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          startTimeRef.current = Date.now();
          setDuration(0);
          timerRef.current = setInterval(() => {
            setDuration(Math.floor((Date.now() - startTimeRef.current) / 1000));
          }, 250);
          setRecording(true);
        } catch (err) {
          setError("Mic access denied. You can still continue without a voice note.");
        }
      };

      const stopRecording = () => {
        if (recorderRef.current && recorderRef.current.state === "recording") {
          recorderRef.current.stop();
        }
        if (timerRef.current) {
          clearInterval(timerRef.current);
          timerRef.current = null;
        }
        setRecording(false);
      };

      const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

      return (
        <div className="screen">
          <div className="photo-preview">
            <img src={photo.dataUrl} alt="Item" />
          </div>

          <div className="audio-card">
            <div className="audio-row">
              <button
                className={`mic-btn ${recording ? "recording" : ""}`}
                onClick={recording ? stopRecording : startRecording}
                aria-label={recording ? "Stop recording" : "Start recording"}
              >
                {recording ? "■" : "🎤"}
              </button>
              <div className="audio-info">
                {recording ? (
                  <>
                    <div className="audio-title">Recording… {fmt(duration)}</div>
                    <div className="audio-sub">Tap stop when you're done</div>
                  </>
                ) : audioUrl ? (
                  <>
                    <div className="audio-title">Voice note saved</div>
                    <div className="audio-sub">{fmt(duration)} — tap mic to re-record</div>
                  </>
                ) : (
                  <>
                    <div className="audio-title">Add a voice note <span style={{color:"#6c6c84",fontWeight:400}}>(optional)</span></div>
                    <div className="audio-sub">Describe condition, brand, size, etc.</div>
                  </>
                )}
              </div>
            </div>
            {recording && (
              <div className="waveform">
                {Array.from({ length: 28 }).map((_, i) => (
                  <div
                    key={i}
                    className="wave-bar"
                    style={{ animationDelay: `${(i % 7) * 0.08}s` }}
                  />
                ))}
              </div>
            )}
            {audioUrl && !recording && (
              <div className="audio-saved">
                <span>✓</span>
                <audio src={audioUrl} controls style={{ width: "100%", height: 32 }} />
              </div>
            )}
            {error && <div style={{fontSize:12,color:"#ef4444"}}>{error}</div>}
          </div>

          <button className="btn btn-primary" onClick={() => onAddAudio({ audioUrl, duration })}>
            Analyze with AI →
          </button>
          <button className="btn btn-ghost" onClick={onRetake}>← Retake photo</button>
        </div>
      );
    }

    function AnalyzingScreen() {
      return (
        <div className="analyzing">
          <div className="spinner" />
          <div>
            <div className="analyzing-text">Analyzing your item…</div>
            <div className="analyzing-sub" style={{marginTop:8}}>Identifying the product, condition, and pricing</div>
          </div>
        </div>
      );
    }

    function ListingScreen({ photo, listing, onUpdate, onReset }) {
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 1800);
      };

      const formatted = () =>
        `${listing.title}\n\n${listing.description}\n\nCategory: ${listing.category}\nAsking: ${listing.priceRange}`;

      const handleCopy = async () => {
        const text = formatted();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          showToast("Copied!");
        } catch {
          showToast("Couldn't copy");
        }
      };

      const handleShare = async () => {
        const text = formatted();
        if (navigator.share) {
          try {
            await navigator.share({ title: listing.title, text });
          } catch {
            /* user cancelled */
          }
        } else {
          await handleCopy();
          showToast("Copied — paste anywhere!");
        }
      };

      return (
        <div className="screen">
          <div className="listing-header">
            <img src={photo.dataUrl} alt="Item" className="photo-thumb" />
            <div className="listing-meta">
              <span className="listing-tag">✨ AI generated</span>
              <div className="listing-title-preview">{listing.title}</div>
            </div>
          </div>

          <div>
            <div className="field">
              <label className="label">Title</label>
              <input
                value={listing.title}
                onChange={(e) => onUpdate({ ...listing, title: e.target.value })}
              />
            </div>

            <div className="field">
              <label className="label">Description</label>
              <textarea
                value={listing.description}
                onChange={(e) => onUpdate({ ...listing, description: e.target.value })}
                rows={6}
              />
            </div>

            <div className="field">
              <label className="label">Category</label>
              <select
                value={listing.category}
                onChange={(e) => onUpdate({ ...listing, category: e.target.value })}
              >
                {CATEGORIES.map((c) => (
                  <option key={c} value={c}>{c}</option>
                ))}
              </select>
            </div>

            <div className="field">
              <label className="label">Suggested price</label>
              <input
                value={listing.priceRange}
                onChange={(e) => onUpdate({ ...listing, priceRange: e.target.value })}
              />
            </div>
          </div>

          <button className="btn btn-primary" onClick={handleCopy}>
            📋 Copy listing
          </button>
          <div className="row">
            <button className="btn btn-secondary" onClick={handleShare}>↗ Share</button>
            <button className="btn btn-secondary" onClick={onReset}>+ New listing</button>
          </div>

          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    function App() {
      const [step, setStep] = useState("home"); // home | review | analyzing | listing
      const [photo, setPhoto] = useState(null);
      const [audio, setAudio] = useState(null);
      const [listing, setListing] = useState(null);
      const sampleIndexRef = useRef(0);

      const handlePhoto = (p) => {
        setPhoto(p);
        setStep("review");
      };

      const handleAnalyze = (audioData) => {
        setAudio(audioData);
        setStep("analyzing");
        setTimeout(() => {
          const next = SAMPLE_LISTINGS[sampleIndexRef.current % SAMPLE_LISTINGS.length];
          sampleIndexRef.current += 1;
          setListing({ ...next });
          setStep("listing");
        }, 2000);
      };

      const handleReset = () => {
        setPhoto(null);
        setAudio(null);
        setListing(null);
        setStep("home");
      };

      const handleRetake = () => {
        setPhoto(null);
        setStep("home");
      };

      return (
        <>
          <Header />
          {step === "home" && <HomeScreen onPhoto={handlePhoto} />}
          {step === "review" && (
            <PhotoReviewScreen
              photo={photo}
              onAddAudio={handleAnalyze}
              onSkipAudio={() => handleAnalyze({ audioUrl: null, duration: 0 })}
              onRetake={handleRetake}
            />
          )}
          {step === "analyzing" && <AnalyzingScreen />}
          {step === "listing" && (
            <ListingScreen
              photo={photo}
              listing={listing}
              onUpdate={setListing}
              onReset={handleReset}
            />
          )}
          <div className="footer-note">Prototype — AI results are simulated</div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
