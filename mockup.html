<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f0f1a" />
<title>Pic for Sale — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { background: #0f0f1a; color: #f4f4f7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; min-height: 100dvh; }
#app { max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font-family: inherit; cursor: pointer; border: none; }
input, textarea, select { font-family: inherit; background: #1a1a2e; color: #f4f4f7; border: 1px solid #2a2a40; border-radius: 12px; padding: 12px 14px; font-size: 16px; width: 100%; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #34d399; }
textarea { resize: vertical; min-height: 110px; line-height: 1.5; font-family: inherit; }
.header { padding: 24px 20px 8px; text-align: center; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.brand-accent { color: #34d399; }
.tagline { font-size: 13px; color: #8888a0; margin-top: 4px; letter-spacing: 0.02em; }
.mockup-pill { display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8b5cf6; background: rgba(139, 92, 246, 0.12); padding: 4px 10px; border-radius: 999px; }
.screen { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; }
.home-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 24px; padding: 20px 0 40px; }
.home-headline { font-size: 30px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
.home-subhead { font-size: 15px; color: #a0a0b8; max-width: 280px; line-height: 1.5; }
.camera-button { background: #34d399; color: #0a1f17; width: 200px; height: 200px; border-radius: 50%; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.45); transition: transform 0.15s ease; animation: pulse 2.4s ease-in-out infinite; }
.camera-button:active { transform: scale(0.96); }
.cam-icon { font-size: 56px; line-height: 1; }
@keyframes pulse { 0%, 100% { box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.45), 0 0 0 0 rgba(52, 211, 153, 0.45); } 50% { box-shadow: 0 20px 60px -10px rgba(52, 211, 153, 0.6), 0 0 0 18px rgba(52, 211, 153, 0); } }
.how-it-works { padding: 8px 20px 28px; border-top: 1px solid #1d1d2e; }
.how-title { font-size: 11px; font-weight: 600; color: #6c6c84; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; margin-bottom: 14px; }
.how-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.how-step { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
.how-icon { width: 44px; height: 44px; border-radius: 12px; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.how-label { font-size: 11px; color: #a0a0b8; font-weight: 500; }
.how-arrow { color: #34d399; font-size: 16px; }
.photo-preview { width: 100%; border-radius: 16px; overflow: hidden; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; position: relative; font-size: 120px; filter: saturate(0.85); }
.sample-tag { position: absolute; top: 12px; left: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(0,0,0,0.55); color: #fff; padding: 4px 10px; border-radius: 999px; }
.photo-thumb { width: 76px; height: 76px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 32px; }
.label { font-size: 12px; font-weight: 600; color: #8888a0; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.btn { padding: 14px 18px; border-radius: 14px; font-size: 16px; font-weight: 600; width: 100%; transition: transform 0.1s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: #34d399; color: #0a1f17; }
.btn-secondary { background: #1a1a2e; color: #f4f4f7; border: 1px solid #2a2a40; }
.btn-ghost { background: transparent; color: #a0a0b8; }
.row { display: flex; gap: 10px; }
.row > .btn { flex: 1; }
.field { margin-bottom: 14px; }
.audio-card { background: #14142a; border: 1px solid #1d1d2e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.audio-row { display: flex; align-items: center; gap: 12px; }
.mic-btn { width: 56px; height: 56px; border-radius: 50%; background: #34d399; color: #0a1f17; font-size: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.mic-btn.recording { background: #ef4444; color: #fff; animation: recPulse 1.1s ease-in-out infinite; }
@keyframes recPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); } 50% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } }
.audio-info { flex: 1; min-width: 0; }
.audio-title { font-size: 14px; font-weight: 600; }
.audio-sub { font-size: 12px; color: #8888a0; margin-top: 2px; }
.waveform { display: flex; align-items: center; gap: 3px; height: 28px; }
.wave-bar { flex: 1; background: #34d399; border-radius: 2px; min-height: 4px; animation: waveBounce 0.9s ease-in-out infinite; }
@keyframes waveBounce { 0%, 100% { height: 20%; } 50% { height: 90%; } }
.audio-saved { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #34d399; font-weight: 500; background: rgba(52,211,153,0.08); padding: 8px 12px; border-radius: 10px; }
.analyzing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 60px 20px; text-align: center; }
.spinner { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #1a1a2e; border-top-color: #34d399; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.analyzing-text { font-size: 18px; font-weight: 600; }
.analyzing-sub { font-size: 13px; color: #8888a0; max-width: 240px; margin-top: 8px; }
.listing-header { display: flex; gap: 12px; align-items: center; padding: 12px; background: #14142a; border: 1px solid #1d1d2e; border-radius: 16px; }
.listing-meta { flex: 1; min-width: 0; }
.listing-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #34d399; background: rgba(52,211,153,0.12); padding: 4px 8px; border-radius: 6px; font-weight: 600; letter-spacing: 0.04em; }
.listing-title-preview { font-size: 14px; font-weight: 600; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #34d399; color: #0a1f17; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5); z-index: 100; animation: toastIn 0.25s ease; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.footer-note { text-align: center; font-size: 11px; color: #4a4a60; padding: 12px 20px 20px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand">Pic <span class="brand-accent">for</span> Sale</div>
    <div class="tagline">Snap it. List it. Sell it.</div>
    <div class="mockup-pill">✨ Interactive Mockup</div>
  </div>
  <div id="content"></div>
  <div class="footer-note">Mockup — sample photos &amp; simulated voice/AI</div>
</div>

<script>
var SAMPLES = [
  { emoji: "🍳", bg: "linear-gradient(135deg, #dc2626 0%, #991b1b 100%)", title: "KitchenAid Artisan Stand Mixer — Like New", category: "Home & Kitchen", description: "KitchenAid Artisan Series 5-Quart Stand Mixer in Empire Red. Barely used, kept on counter and wiped after each use. Comes with original flat beater, dough hook, and wire whip. Pet-free and smoke-free home. Perfect for home bakers — runs quietly and powerfully. No box.", priceRange: "$85 – $120" },
  { emoji: "🧥", bg: "linear-gradient(135deg, #78350f 0%, #422006 100%)", title: "Men's Brown Leather Jacket — Size L, Excellent Condition", category: "Clothing & Accessories", description: "Genuine leather men's biker-style jacket in rich brown. Size Large. Worn only a handful of times — no scuffs, scratches, or odors. Two zip front pockets and one inner pocket. Smooth full-zip closure. Fits true to size. From a smoke-free home.", priceRange: "$45 – $75" },
  { emoji: "🪑", bg: "linear-gradient(135deg, #1f2937 0%, #030712 100%)", title: "SecretLab Titan Gaming Chair — Black, Adult-Owned", category: "Furniture", description: "SecretLab Titan ergonomic gaming chair in stealth black. Adult-owned and used in a home office, not abused by gamers. Memory foam lumbar pillow and headrest pillow included. All recline and tilt functions work perfectly. Minor wear on armrests, otherwise like new. Local pickup preferred — heavy item.", priceRange: "$180 – $250" },
  { emoji: "💡", bg: "linear-gradient(135deg, #b45309 0%, #78350f 100%)", title: "Vintage Mid-Century Brass Table Lamp", category: "Home Decor", description: "Beautiful vintage mid-century modern table lamp with a solid brass base and original cream linen drum shade. Approximately 22 inches tall. Newly rewired and tested — works perfectly. A great accent piece for a living room, bedroom, or office. Patina adds character; no major dings.", priceRange: "$35 – $60" }
];
var CATEGORIES = ["Home & Kitchen","Furniture","Clothing & Accessories","Home Decor","Electronics","Tools","Toys & Games","Sports & Outdoors","Books & Media","Other"];

var state = { step: "home", sampleIdx: 0, cycle: 0, listing: null, recording: false, hasRecording: false, duration: 0, recTimer: null };

var content = document.getElementById("content");

function esc(s) { return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function fmtTime(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

function render() {
  if (state.step === "home") renderHome();
  else if (state.step === "review") renderReview();
  else if (state.step === "analyzing") renderAnalyzing();
  else if (state.step === "listing") renderListing();
}

function renderHome() {
  content.innerHTML =
    '<div class="screen">' +
      '<div class="home-hero">' +
        '<h1 class="home-headline">Point. Shoot.<br/>Sell.</h1>' +
        '<p class="home-subhead">Tap to grab a sample item. The real app uses your camera.</p>' +
        '<button class="camera-button" id="takePhoto"><span class="cam-icon">📸</span><span>Take Photo</span></button>' +
      '</div>' +
    '</div>' +
    '<div class="how-it-works">' +
      '<p class="how-title">How it works</p>' +
      '<div class="how-row">' +
        '<div class="how-step"><div class="how-icon">📸</div><div class="how-label">Snap</div></div>' +
        '<div class="how-arrow">→</div>' +
        '<div class="how-step"><div class="how-icon">🤖</div><div class="how-label">AI lists it</div></div>' +
        '<div class="how-arrow">→</div>' +
        '<div class="how-step"><div class="how-icon">📋</div><div class="how-label">Copy &amp; sell</div></div>' +
      '</div>' +
    '</div>';
  document.getElementById("takePhoto").addEventListener("click", function() {
    state.sampleIdx = state.cycle % SAMPLES.length;
    state.cycle++;
    state.step = "review";
    state.recording = false;
    state.hasRecording = false;
    state.duration = 0;
    render();
  });
}

function renderReview() {
  var s = SAMPLES[state.sampleIdx];
  var audioInner;
  if (state.recording) {
    audioInner = '<div class="audio-title">Recording… ' + fmtTime(state.duration) + '</div><div class="audio-sub">Tap stop when you\'re done</div>';
  } else if (state.hasRecording) {
    audioInner = '<div class="audio-title">Voice note saved</div><div class="audio-sub">' + fmtTime(state.duration) + ' — tap mic to re-record</div>';
  } else {
    audioInner = '<div class="audio-title">Add a voice note <span style="color:#6c6c84;font-weight:400">(optional)</span></div><div class="audio-sub">Mockup — tap mic to simulate recording</div>';
  }
  var waveform = "";
  if (state.recording) {
    var bars = "";
    for (var i = 0; i < 28; i++) bars += '<div class="wave-bar" style="animation-delay:' + ((i % 7) * 0.08) + 's"></div>';
    waveform = '<div class="waveform">' + bars + '</div>';
  }
  var saved = (state.hasRecording && !state.recording) ? '<div class="audio-saved"><span>✓</span><span>Voice note ready to be analyzed</span></div>' : "";

  content.innerHTML =
    '<div class="screen">' +
      '<div class="photo-preview" style="background:' + s.bg + '">' + s.emoji +
        '<span class="sample-tag">Sample photo</span>' +
      '</div>' +
      '<div class="audio-card">' +
        '<div class="audio-row">' +
          '<button class="mic-btn ' + (state.recording ? "recording" : "") + '" id="micBtn">' + (state.recording ? "■" : "🎤") + '</button>' +
          '<div class="audio-info">' + audioInner + '</div>' +
        '</div>' +
        waveform + saved +
      '</div>' +
      '<button class="btn btn-primary" id="analyzeBtn">Analyze with AI →</button>' +
      '<button class="btn btn-ghost" id="retakeBtn">← Retake photo</button>' +
    '</div>';

  document.getElementById("micBtn").addEventListener("click", function() {
    if (state.recording) {
      clearInterval(state.recTimer);
      state.recTimer = null;
      state.recording = false;
      state.hasRecording = true;
    } else {
      state.recording = true;
      state.hasRecording = false;
      state.duration = 0;
      var startTime = Date.now();
      state.recTimer = setInterval(function() {
        state.duration = Math.floor((Date.now() - startTime) / 1000);
        render();
      }, 1000);
    }
    render();
  });
  document.getElementById("analyzeBtn").addEventListener("click", function() {
    if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; }
    state.step = "analyzing";
    render();
    setTimeout(function() {
      var src = SAMPLES[state.sampleIdx];
      state.listing = { title: src.title, description: src.description, category: src.category, priceRange: src.priceRange };
      state.step = "listing";
      render();
    }, 2000);
  });
  document.getElementById("retakeBtn").addEventListener("click", function() {
    if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; }
    state.step = "home";
    render();
  });
}

function renderAnalyzing() {
  content.innerHTML =
    '<div class="analyzing">' +
      '<div class="spinner"></div>' +
      '<div>' +
        '<div class="analyzing-text">Analyzing your item…</div>' +
        '<div class="analyzing-sub">Identifying the product, condition, and pricing</div>' +
      '</div>' +
    '</div>';
}

function renderListing() {
  var s = SAMPLES[state.sampleIdx];
  var L = state.listing;
  var opts = CATEGORIES.map(function(c) { return '<option value="' + esc(c) + '"' + (c === L.category ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join("");
  content.innerHTML =
    '<div class="screen">' +
      '<div class="listing-header">' +
        '<div class="photo-thumb" style="background:' + s.bg + '">' + s.emoji + '</div>' +
        '<div class="listing-meta">' +
          '<span class="listing-tag">✨ AI generated</span>' +
          '<div class="listing-title-preview">' + esc(L.title) + '</div>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="field"><label class="label">Title</label><input id="fTitle" value="' + esc(L.title) + '"></div>' +
        '<div class="field"><label class="label">Description</label><textarea id="fDesc" rows="6">' + esc(L.description) + '</textarea></div>' +
        '<div class="field"><label class="label">Category</label><select id="fCat">' + opts + '</select></div>' +
        '<div class="field"><label class="label">Suggested price</label><input id="fPrice" value="' + esc(L.priceRange) + '"></div>' +
      '</div>' +
      '<button class="btn btn-primary" id="copyBtn">📋 Copy listing</button>' +
      '<div class="row">' +
        '<button class="btn btn-secondary" id="shareBtn">↗ Share</button>' +
        '<button class="btn btn-secondary" id="newBtn">+ New listing</button>' +
      '</div>' +
    '</div>';

  document.getElementById("fTitle").addEventListener("input", function(e) { L.title = e.target.value; });
  document.getElementById("fDesc").addEventListener("input", function(e) { L.description = e.target.value; });
  document.getElementById("fCat").addEventListener("change", function(e) { L.category = e.target.value; });
  document.getElementById("fPrice").addEventListener("input", function(e) { L.priceRange = e.target.value; });

  function fmt() { return L.title + "\n\n" + L.description + "\n\nCategory: " + L.category + "\nAsking: " + L.priceRange; }
  function showToast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 1800);
  }
  document.getElementById("copyBtn").addEventListener("click", function() {
    var text = fmt();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ showToast("Copied!"); }).catch(function(){ showToast("Couldn't copy"); });
    } else {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); showToast("Copied!"); } catch(e){ showToast("Couldn't copy"); } document.body.removeChild(ta);
    }
  });
  document.getElementById("shareBtn").addEventListener("click", function() {
    var text = fmt();
    if (navigator.share) {
      navigator.share({ title: L.title, text: text }).catch(function(){});
    } else {
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      showToast("Copied — paste anywhere!");
    }
  });
  document.getElementById("newBtn").addEventListener("click", function() {
    state.listing = null;
    state.step = "home";
    render();
  });
}

render();
</script>
</body>
</html>
